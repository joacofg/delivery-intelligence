[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rappi-competitive-intelligence"
version = "0.1.0"
description = "Competitive intelligence scraping challenge for Rappi."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "jinja2==3.1.6",
  "matplotlib==3.9.4",
  "pandas==2.3.3",
  "playwright==1.55.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[project.scripts]
ci = "ci.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
